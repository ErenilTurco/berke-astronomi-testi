fill="#E56B31" stroke="none" stroke-width="2"/><text x="623" y="483" fill="#087D83" font-family="Arial, sans-serif" font-size="20" font-weight="700">PERIELIO</text><text x="80" y="483" fill="#E56B31" font-family="Arial, sans-serif" font-size="20" font-weight="700">AFELIO</text><text x="615" y="511" fill="#087D83" font-family="Arial, sans-serif" font-size="19" font-weight="400">più vicino</text><text x="70" y="511" fill="#E56B31" font-family="Arial, sans-serif" font-size="19" font-weight="400">più lontano</text><line x1="382" y1="238" x2="326" y2="245" stroke="#2458CC" stroke-width="3"/><line x1="326" y1="245" x2="336.07451485083857" y2="238.48047927219855" stroke="#2458CC" stroke-width="3"/><line x1="326" y1="245" x2="337.36933488073316" y2="248.839039511355" stroke="#2458CC" stroke-width="3"/><text x="90" y="575" fill="#2458CC" font-family="Arial, sans-serif" font-size="23" font-weight="700">Il Sole è in uno dei due fuochi dell’ellisse.</text><text x="785" y="223" fill="#2458CC" font-family="Arial, sans-serif" font-size="19" font-weight="700">RIVOLUZIONE</text><text x="785" y="260" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">È il moto di un pianeta intorno al</text><text x="785" y="289.92" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Sole. La gravità del Sole ne curva il</text><text x="785" y="319.84000000000003" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">percorso.</text><text x="785" y="406" fill="#2458CC" font-family="Arial, sans-serif" font-size="19" font-weight="700">PERIODO T</text><text x="785" y="443" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">È il tempo per un giro completo. Per</text><text x="785" y="472.92" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">la Terra è circa 1 anno.</text><rect x="45" y="645" width="1110" height="171" rx="20" fill="#12263D" stroke="none"/><text x="75" y="686" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">L’ellisse in due idee</text><text x="75" y="726" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="400">La somma delle distanze da un punto dell’ellisse ai due fuochi</text><text x="75" y="755.92" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="400">è costante.</text><text x="750" y="690" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="400">Eccentricità e = distanza tra i fuochi /</text><text x="750" y="718.56" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="400">asse maggiore. Con e = 0 si ha un</text><text x="750" y="747.1199999999999" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="400">cerchio; con 0 &lt; e &lt; 1 un’ellisse.</text></svg>