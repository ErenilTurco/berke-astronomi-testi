ll="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Al perielio il pianeta si muove più</text><text x="785" y="290.92" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">velocemente. In uno stesso tempo</text><text x="785" y="320.84000000000003" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">percorre un arco più lungo.</text><text x="785" y="432" fill="#E56B31" font-family="Arial, sans-serif" font-size="19" font-weight="700">LONTANO DAL SOLE</text><text x="785" y="468" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">All’afelio si muove più lentamente.</text><text x="785" y="497.92" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Nello stesso tempo percorre un arco</text><text x="785" y="527.84" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">più corto.</text><rect x="45" y="660" width="1110" height="155" rx="20" fill="#12263D" stroke="none"/><text x="75" y="700" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">L’errore da evitare</text><text x="75" y="739" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="400">Tempi uguali non significano distanze percorse uguali. È l’area spazzata dal segmento</text><text x="75" y="771.64" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="400">Sole-pianeta a rimanere uguale.</text></svg>