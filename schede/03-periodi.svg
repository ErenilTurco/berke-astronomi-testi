<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Scheda 3 di Missione Cosmo"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#F7F5EF" stroke="none"/><text x="45" y="39" fill="#2458CC" font-family="Arial, sans-serif" font-size="16" font-weight="700">MISSIONE COSMO  /  BERKE  /  PRIMA SUPERIORE</text><text x="45" y="93" fill="#12263D" font-family="Arial, sans-serif" font-size="43" font-weight="700">Più lontano? Serve più tempo.</text><text x="45" y="133" fill="#566877" font-family="Arial, sans-serif" font-size="21" font-weight="400">Terza legge di Keplero: la legge dei periodi</text><line x1="45" y1="162" x2="1155" y2="162" stroke="#D3D9D9" stroke-width="1"/><text x="45" y="870" fill="#566877" font-family="Arial, sans-serif" font-size="15" font-weight="400">Rielaborazione didattica del PDF fornito · pagina 1, figura 29C; pagina 2, figura C ed esercizio c · Schemi non in scala.</text><text x="1110" y="870" fill="#2458CC" font-family="Arial, sans-serif" font-size="19" font-weight="700">03</text><rect x="45" y="188" width="690" height="252" rx="20" fill="#12263D" stroke="none"/><text x="80" y="255" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="56" font-weight="700">T² = k · a³</text><text x="80" y="311" fill="#FFC870" font-family="Arial, sans-serif" font-size="30" font-weight="700">Intorno al Sole: T² = a³</text><text x="80" y="357" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="400">T in anni terrestri; a in unità astronomiche (UA). 1 UA è circa</text><text x="80" y="386.92" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="400">la distanza media Terra-Sole.</text><text x="775" y="225" fill="#2458CC" font-family="Arial, sans-serif" font-size="19" font-weight="700">LEGGI LA FORMULA</text><text x="775" y="265" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">T è il periodo di rivoluzione. a è il</text><text x="775" y="294.92" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">semiasse maggiore: nel PDF è</text><text x="775" y="324.84000000000003" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">indicato come r, distanza media dal</text><text x="775" y="354.76000000000005" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Sole.</text><text x="775" y="415" fill="#E56B31" font-family="Arial, sans-serif" font-size="22" font-weight="700">Non è una relazione lineare.</text><text x="70" y="494" fill="#566877" font-family="Arial, sans-serif" font-size="17" font-weight="700">ORBITA</text><text x="390" y="494" fill="#566877" font-family="Arial, sans-serif" font-size="17" font-weight="700">a (UA)</text><text x="560" y="494" fill="#566877" font-family="Arial, sans-serif" font-size="17" font-weight="700">T (anni)</text><rect x="45" y="513" width="690" height="55" rx="10" fill="#FFFFFF" stroke="none"/><circle cx="80" cy="541" r="8" fill="#2458CC" stroke="none" stroke-width="2"/><text x="105" y="548" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Terra</text><text x="400" y="548" fill="#2458CC" font-family="Arial, sans-serif" font-size="22" font-weight="700">1</text><text x="565" y="548" fill="#2458CC" font-family="Arial, sans-serif" font-size="22" font-weight="700">1</text><rect x="45" y="577" width="690" height="55" rx="10" fill="#FFFFFF" stroke="none"/><circle cx="80" cy="605" r="8" fill="#087D83" stroke="none" stroke-width="2"/><text x="105" y="612" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Pianeta ipotetico</text><text x="400" y="612" fill="#087D83" font-family="Arial, sans-serif" font-size="22" font-weight="700">2</text><text x="565" y="612" fill="#087D83" font-family="Arial, sans-serif" font-size="22" font-weight="700">≈ 2,83</text><rect x="45" y="641" width="690" height="55" rx="10" fill="#FFFFFF" stroke="none"/><circle cx="80" cy="669" r="8" fill="#E56B31" stroke="none" stroke-width="2"/><text x="105" y="676" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Pianeta ipotetico</text><text x="400" y="676" fill="#E56B31" font-family="Arial, sans-serif" font-size="22" font-weight="700">4</text><text x="565" y="676" fill="#E56B31" font-family="Arial, sans-serif" font-size="22" font-weight="700">8</text><rect x="45" y="705" width="690" height="55" rx="10" fill="#FFFFFF" stroke="none"/><circle cx="80" cy="733" r="8" fill="#2458CC" stroke="none" stroke-width="2"/><text x="105" y="740" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Saturno (esercizio)</text><text x="400" y="740" fill="#2458CC" font-family="Arial, sans-serif" font-size="22" font-weight="700">9,5</text><text x="565" y="740" fill="#2458CC" font-family="Arial, sans-serif" font-size="22" font-weight="700">≈ 29,3</text><rect x="775" y="470" width="380" height="312" rx="20" fill="#E6ECF7" stroke="none"/><text x="802" y="517" fill="#2458CC" font-family="Arial, sans-serif" font-size="20" font-weight="700">PROVA CON a = 4 UA</text><text x="802" y="570" fill="#12263D" font-family="Arial, sans-serif" font-size="30" font-weight="700">T² = 4³ = 64</text><text x="802" y="618" fill="#12263D" font-family="Arial, sans-serif" font-size="29" font-weight="700">T = √64 = 8 anni</text><text x="802" y="666" fill="#23394B" font-family="Arial, sans-serif" font-size="23" font-weight="400">Raddoppiare a non raddoppia</text><text x="802" y="697.28" fill="#23394B" font-family="Arial, sans-serif" font-size="23" font-weight="400">T: il periodo cresce di più.</text></svg>