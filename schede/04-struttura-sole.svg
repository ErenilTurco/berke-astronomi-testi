<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Scheda 4 di Missione Cosmo"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#F7F5EF" stroke="none"/><text x="45" y="39" fill="#2458CC" font-family="Arial, sans-serif" font-size="16" font-weight="700">MISSIONE COSMO  /  BERKE  /  PRIMA SUPERIORE</text><text x="45" y="93" fill="#12263D" font-family="Arial, sans-serif" font-size="43" font-weight="700">Dentro il Sole, fino alla luce.</text><text x="45" y="133" fill="#566877" font-family="Arial, sans-serif" font-size="21" font-weight="400">Una stella composta soprattutto da idrogeno: segui il viaggio dell’energia</text><line x1="45" y1="162" x2="1155" y2="162" stroke="#D3D9D9" stroke-width="1"/><text x="45" y="870" fill="#566877" font-family="Arial, sans-serif" font-size="15" font-weight="400">Rielaborazione didattica del PDF fornito · pagina 3, figura 26 e tabella 2; pagina 5, mappa · Schemi non in scala.</text><text x="1110" y="870" fill="#2458CC" font-family="Arial, sans-serif" font-size="19" font-weight="700">04</text><circle cx="330" cy="445" r="225" fill="#F6E4BC" stroke="none" stroke-width="2"/><circle cx="330" cy="445" r="201" fill="#E7A557" stroke="none" stroke-width="2"/><circle cx="330" cy="445" r="187" fill="#EE7445" stroke="none" stroke-width="2"/><circle cx="330" cy="445" r="174" fill="#FFCA64" stroke="none" stroke-width="2"/><circle cx="330" cy="445" r="122" fill="#FFE79B" stroke="none" stroke-width="2"/><circle cx="330" cy="445" r="55" fill="#FFF4D7" stroke="none" stroke-width="2"/><circle cx="479.0" cy="445.0" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="459.0377851638814" cy="519.5" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="404.5" cy="574.0377851638814" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="330.0" cy="594.0" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="255.50000000000003" cy="574.0377851638814" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="200.96221483611862" cy="519.5" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="181.0" cy="445.0" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="200.96221483611862" cy="370.5" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="255.49999999999994" cy="315.9622148361187" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="330.0" cy="296.0" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="404.5" cy="315.9622148361186" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><circle cx="459.0377851638813" cy="370.49999999999994" r="15" fill="#FFCA64" stroke="#DA9043" stroke-width="2"/><text x="312" y="457" fill="#E56B31" font-family="Arial, sans-serif" font-size="32" font-weight="700">1</text><circle cx="419.0" cy="445.0" r="17" fill="#12263D" stroke="none" stroke-width="2"/><text x="413.0" y="452.0" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text><circle cx="465.9675124552542" cy="379.32020434920423" r="17" fill="#12263D" stroke="none" stroke-width="2"/><text x="459.9675124552542" y="386.32020434920423" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text><circle cx="462.4356852661616" cy="568.3766155642235" r="17" fill="#12263D" stroke="none" stroke-width="2"/><text x="456.4356852661616" y="575.3766155642235" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text><circle cx="248.4352200367601" cy="623.2222956578337" r="17" fill="#12263D" stroke="none" stroke-width="2"/><text x="242.4352200367601" y="630.2222956578337" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">5</text><circle cx="117.15161323090425" cy="475.34080173287145" r="17" fill="#12263D" stroke="none" stroke-width="2"/><text x="111.15161323090425" y="482.34080173287145" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">6</text><text x="125" y="740" fill="#E56B31" font-family="Arial, sans-serif" font-size="24" font-weight="700">L’energia nasce nel nucleo.</text><text x="95" y="779" fill="#566877" font-family="Arial, sans-serif" font-size="22" font-weight="400">Il Sole non ha una superficie solida.</text><circle cx="638" cy="220" r="20" fill="#E56B31" stroke="none" stroke-width="2"/><text x="632" y="227" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text><text x="675" y="215" fill="#E56B31" font-family="Arial, sans-serif" font-size="24" font-weight="700">Nucleo</text><text x="675" y="246" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">Fusione nucleare: idrogeno → elio. Circa 15 milioni</text><text x="675" y="273.2" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">di °C.</text><circle cx="638" cy="319" r="20" fill="#2458CC" stroke="none" stroke-width="2"/><text x="632" y="326" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text><text x="675" y="314" fill="#2458CC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Zona radiativa</text><text x="675" y="345" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">L’energia si trasferisce per irraggiamento.</text><circle cx="638" cy="418" r="20" fill="#087D83" stroke="none" stroke-width="2"/><text x="632" y="425" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text><text x="675" y="413" fill="#087D83" font-family="Arial, sans-serif" font-size="24" font-weight="700">Zona convettiva</text><text x="675" y="444" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">Il plasma caldo sale; quello più freddo scende.</text><circle cx="638" cy="517" r="20" fill="#E56B31" stroke="none" stroke-width="2"/><text x="632" y="524" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text><text x="675" y="512" fill="#E56B31" font-family="Arial, sans-serif" font-size="24" font-weight="700">Fotosfera</text><text x="675" y="543" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">Superficie visibile: granuli e macchie. Circa 6 000</text><text x="675" y="570.2" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">°C (arrotondati).</text><circle cx="638" cy="616" r="20" fill="#2458CC" stroke="none" stroke-width="2"/><text x="632" y="623" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">5</text><text x="675" y="611" fill="#2458CC" font-family="Arial, sans-serif" font-size="24" font-weight="700">Cromosfera</text><text x="675" y="642" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">Strato sopra la fotosfera: getti di gas e</text><text x="675" y="669.2" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">protuberanze.</text><circle cx="638" cy="715" r="20" fill="#087D83" stroke="none" stroke-width="2"/><text x="632" y="722" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">6</text><text x="675" y="710" fill="#087D83" font-family="Arial, sans-serif" font-size="24" font-weight="700">Corona</text><text x="675" y="741" fill="#23394B" font-family="Arial, sans-serif" font-size="20" font-weight="400">Atmosfera più esterna; da qui parte il vento solare.</text></svg>