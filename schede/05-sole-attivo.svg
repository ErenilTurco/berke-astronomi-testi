88925" r="8" fill="#FFD984" stroke="none" stroke-width="2"/><circle cx="290.90294991824135" cy="481.71254191734874" r="8" fill="#FFD984" stroke="none" stroke-width="2"/><circle cx="133.81415245487432" cy="316.32717915592457" r="8" fill="#FFD984" stroke="none" stroke-width="2"/><circle cx="363.8222595827164" cy="332.3460750943247" r="8" fill="#FFD984" stroke="none" stroke-width="2"/><circle cx="286" cy="356" r="25" fill="#8B502F" stroke="none" stroke-width="2"/><circle cx="286" cy="356" r="13" fill="#432D29" stroke="none" stroke-width="2"/><line x1="298" y1="350" x2="437" y2="280" stroke="#FFFFFF" stroke-width="2"/><text x="394" y="260" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">Macchia</text><line x1="178" y1="409" x2="90" y2="483" stroke="#FFFFFF" stroke-width="2"/><text x="77" y="511" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">Granuli</text><text x="610" y="222" fill="#2458CC" font-family="Arial, sans-serif" font-size="18" font-weight="700">FOTOSFERA</text><text x="610" y="257" fill="#23394B" font-family="Arial, sans-serif" font-size="23" font-weight="400">I granuli sono legati alla convezione: il plasma caldo</text><text x="610" y="288.28" fill="#23394B" font-family="Arial, sans-serif" font-size="23" font-weight="400">risale e quello più freddo scende.</text><text x="610" y="355" fill="#23394B" font-family="Arial, sans-serif" font-size="23" font-weight="400">Le macchie sono zone più fredde del resto della</text><text x="610" y="386.28" fill="#23394B" font-family="Arial, sans-serif" font-size="23" font-weight="400">fotosfera, legate a fenomeni magnetici. Non sono</text><text x="610" y="417.55999999999995" fill="#23394B" font-family="Arial, sans-serif" font-size="23" font-weight="400">buchi.</text><text x="610" y="470" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">Nelle eclissi totali la Luna nasconde la fotosfera: si</text><text x="610" y="499.92" fill="#23394B" font-family="Arial, sans-serif" font-size="22" font-weight="400">distinguono meglio cromosfera e corona.</text><text x="45" y="610" fill="#2458CC" font-family="Arial, sans-serif" font-size="20" font-weight="700">RICOSTRUISCI LA MAPPA</text><rect x="45" y="639" width="174" height="118" rx="14" fill="#E6ECF7" stroke="none"/><text x="57" y="676" fill="#2458CC" font-family="Arial, sans-serif" font-size="20" font-weight="700">Nucleo</text><text x="57" y="711" fill="#23394B" font-family="Arial, sans-serif" font-size="18" font-weight="400">fusione</text><line x1="220" y1="696" x2="230" y2="696" stroke="#566877" stroke-width="1.5"/><line x1="230" y1="696" x2="219.19463477176788" y2="701.2195864093347" stroke="#566877" stroke-width="1.5"/><line x1="230" y1="696" x2="219.19463477176788" y2="690.7804135906653" stroke="#566877" stroke-width="1.5"/><rect x="232" y="639" width="174" height="118" rx="14" fill="#E6ECF7" stroke="none"/><text x="244" y="676" fill="#2458CC" font-family="Arial, sans-serif" font-size="20" font-weight="700">Radiativa</text><text x="244" y="711" fill="#23394B" font-family="Arial, sans-serif" font-size="18" font-weight="400">irraggiamento</text><line x1="407" y1="696" x2="417" y2="696" stroke="#566877" stroke-width="1.5"/><line x1="417" y1="696" x2="406.1946347717679" y2="701.2195864093347" stroke="#566877" stroke-width="1.5"/><line x1="417" y1="696" x2="406.1946347717679" y2="690.7804135906653" stroke="#566877" stroke-width="1.5"/><rect x="419" y="639" width="174" height="118" rx="14" fill="#E6ECF7" stroke="none"/><text x="431" y="676" fill="#2458CC" font-family="Arial, sans-serif" font-size="20" font-weight="700">Convettiva</text><text x="431" y="711" fill="#23394B" font-family="Arial, sans-serif" font-size="18" font-weight="400">convezione</text><line x1="594" y1="696" x2="604" y2="696" stroke="#566877" stroke-width="1.5"/><line x1="604" y1="696" x2="593.1946347717678" y2="701.2195864093347" stroke="#566877" stroke-width="1.5"/><line x1="604" y1="696" x2="593.1946347717678" y2="690.7804135906653" stroke="#566877" stroke-width="1.5"/><rect x="606" y="639" width="174" height="118" rx="14" fill="#E6ECF7" stroke="none"/><text x="618" y="676" fill="#2458CC" font-family="Arial, sans-serif" font-size="20" font-weight="700">Fotosfera</text><text x="618" y="711" fill="#23394B" font-family="Arial, sans-serif" font-size="18" font-weight="400">granuli e macchie</text><line x1="781" y1="696" x2="791" y2="696" stroke="#566877" stroke-width="1.5"/><line x1="791" y1="696" x2="780.1946347717678" y2="701.2195864093347" stroke="#566877" stroke-width="1.5"/><line x1="791" y1="696" x2="780.1946347717678" y2="690.7804135906653" stroke="#566877" stroke-width="1.5"/><rect x="793" y="639" width="174" height="118" rx="14" fill="#E4EFEC" stroke="none"/><text x="805" y="676" fill="#087D83" font-family="Arial, sans-serif" font-size="20" font-weight="700">Cromosfera</text><text x="805" y="711" fill="#23394B" font-family="Arial, sans-serif" font-size="18" font-weight="400">getti di gas</text><line x1="968" y1="696" x2="978" y2="696" stroke="#566877" stroke-width="1.5"/><line x1="978" y1="696" x2="967.1946347717678" y2="701.2195864093347" stroke="#566877" stroke-width="1.5"/><line x1="978" y1="696" x2="967.1946347717678" y2="690.7804135906653" stroke="#566877" stroke-width="1.5"/><rect x="980" y="639" width="174" height="118" rx="14" fill="#E4EFEC" stroke="none"/><text x="992" y="676" fill="#087D83" font-family="Arial, sans-serif" font-size="20" font-weight="700">Corona</text><text x="992" y="711" fill="#23394B" font-family="Arial, sans-serif" font-size="18" font-weight="400">vento solare</text><text x="45" y="806" fill="#087D83" font-family="Arial, sans-serif" font-size="23" font-weight="700">Vento solare = flusso di particelle che si allontana dalla corona.</text></svg>